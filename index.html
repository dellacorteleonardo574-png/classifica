<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Campionato Principe</title>
<style>
:root{--bg:#f4f6f3;--card:#fff;--tx:#14231a;--mut:#5d6f63;--ac:#0e7a4b;--ln:#dfe6e0;--g1:#e8f6ee;--g2:#fdecec;--gold:#c99a00;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1511;--card:#17211b;--tx:#e8f1ea;--mut:#9bb0a2;--ac:#3ecf8e;--ln:#26352b;--g1:#14301f;--g2:#341a1a;--gold:#f0c53a}}
:root[data-theme="dark"]{--bg:#0e1511;--card:#17211b;--tx:#e8f1ea;--mut:#9bb0a2;--ac:#3ecf8e;--ln:#26352b;--g1:#14301f;--g2:#341a1a;--gold:#f0c53a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:22px 16px 8px;max-width:860px;margin:0 auto}
h1{margin:0;font-size:26px;letter-spacing:-.02em}
.sub{color:var(--mut);font-size:13px;margin-top:2px}
nav{display:flex;gap:6px;max-width:860px;margin:10px auto 0;padding:0 16px;overflow-x:auto}
nav button{flex:none;border:1px solid var(--ln);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:999px;font:inherit;cursor:pointer}
nav button.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
main{max-width:860px;margin:12px auto 40px;padding:0 16px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:6px 0;margin-bottom:14px}
.sc{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:540px}
th,td{padding:8px 6px;text-align:center;font-variant-numeric:tabular-nums;border-bottom:1px solid var(--ln)}
tr:last-child td{border-bottom:0}
th{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
td.t,th.t{text-align:left}
td.t{white-space:nowrap}
.f{width:26px;height:19px;object-fit:cover;border-radius:3px;vertical-align:middle;margin-right:8px;border:1px solid var(--ln)}
.pts{font-weight:700}
tr.q td:first-child{box-shadow:inset 3px 0 var(--ac)}
tr.w td{background:var(--g1)}
.leg{color:var(--mut);font-size:12px;padding:6px 16px 10px}
h2{font-size:14px;margin:0;padding:10px 16px 4px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.m{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid var(--ln)}
.m:last-child{border-bottom:0}
.m .a{text-align:right}.m span.n{display:inline-flex;align-items:center;gap:8px}
.m .a span.n{flex-direction:row-reverse}.m .f{margin:0}
.r{font-weight:700;background:var(--bg);border-radius:8px;padding:4px 10px;font-variant-numeric:tabular-nums;white-space:nowrap}
.win{font-weight:700}
.champ{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--g1);border:1px solid var(--ln);border-radius:14px;margin-bottom:14px}
.champ .f{width:44px;height:32px;margin:0}
.champ b{display:block;font-size:18px}.champ small{color:var(--gold);font-weight:700;letter-spacing:.06em}
.hide{display:none}
</style>
</head>
<body>

const F=n=>FLAGS[n]?'<img class="f" alt="" src="'+FLAGS[n]+'">':'';
function parseCSV(t){
  const out=[];let row=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
    else if(c=='"')q=true;
    else if(c==','){row.push(f);f=''}
    else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;row.push(f);f='';if(row.some(x=>x.trim()))out.push(row);row=[]}
    else f+=c}
  row.push(f);if(row.some(x=>x.trim()))out.push(row);return out;
}
let PH=[],tab=0;
function setRows(rows){
  const m=new Map();
  rows.forEach(r=>{const k=(r[0]||'').trim();if(!k||k.toLowerCase()=='fase')return;
    if(!m.has(k))m.set(k,[]);m.get(k).push([r[1].trim(),(r[2]||'').trim(),(r[3]||'').trim(),(r[4]||'').trim()])});
  PH=[...m.entries()];
}
const num=x=>/^\d+/.test(x)?parseInt(x):NaN;
const played=m=>!isNaN(num(m[1]))&&!isNaN(num(m[2]));
function standings(){
  const T={};const g=n=>T[n]||(T[n]={n,p:0,g:0,v:0,x:0,l:0,gf:0,gs:0});
  PH.filter(p=>/^giornata/i.test(p[0])).forEach(p=>p[1].forEach(m=>{
    const H=g(m[0]),A=g(m[3]);if(!played(m))return;const a=num(m[1]),b=num(m[2]);
    H.g++;A.g++;H.gf+=a;H.gs+=b;A.gf+=b;A.gs+=a;
    if(a>b){H.p+=3;H.v++;A.l++}else if(a<b){A.p+=3;A.v++;H.l++}else{H.p++;A.p++;H.x++;A.x++}}));
  return Object.values(T).sort((a,b)=>b.p-a.p||(b.gf-b.gs)-(a.gf-a.gs)||b.gf-a.gf||a.n.localeCompare(b.n));
}
function classifica(){
  const S=standings();
  let h='<div class="card sc"><table><thead><tr><th>#</th><th class="t">Squadra</th><th>Pt</th><th>G</th><th>V</th><th>N</th><th>P</th><th>GF</th><th>GS</th><th>DR</th></tr></thead><tbody>';
  S.forEach((t,i)=>{const d=t.gf-t.gs;h+='<tr class="'+(i==0?'w':'')+'"><td>'+(i+1)+'</td><td class="t">'+F(t.n)+esc(t.n)+'</td><td class="pts">'+t.p+'</td><td>'+t.g+'</td><td>'+t.v+'</td><td>'+t.x+'</td><td>'+t.l+'</td><td>'+t.gf+'</td><td>'+t.gs+'</td><td>'+(d>0?'+':'')+d+'</td></tr>'});
  return h+'</tbody></table><div class="leg">3 punti per la vittoria, 1 per il pareggio. A parità di punti conta la differenza reti, poi i gol fatti.</div></div>';
}
function match(m){
  const a=num(m[1]),b=num(m[2]),w=a>b?1:a<b?2:0,sc=played(m)?esc(m[1])+' – '+esc(m[2]):'vs';
  return '<div class="m"><span class="n '+(w==1?'win':'')+'">'+F(m[0])+esc(m[0])+'</span><span class="r">'+sc+'</span><span class="a"><span class="n '+(w==2?'win':'')+'">'+F(m[3])+esc(m[3])+'</span></span></div>';
}
function giornate(){return PH.filter(p=>/^giornata/i.test(p[0])).map(p=>'<h2>'+esc(p[0])+'</h2><div class="card">'+p[1].map(match).join('')+'</div>').join('')||'<p class="leg">Nessuna partita.</p>'}
function finale(){
  const ko=PH.filter(p=>!/^giornata/i.test(p[0]));if(!ko.length)return'<p class="leg">La fase finale non è ancora iniziata.</p>';
  let h='';const fin=ko.find(p=>/^finale/i.test(p[0]));
  if(fin&&fin[1][0]&&played(fin[1][0])){const m=fin[1][0],wn=num(m[1])>num(m[2])?m[0]:m[3];h+='<div class="champ">'+F(wn)+'<div><small>CAMPIONE</small><b>'+esc(wn)+'</b></div></div>'}
  return h+ko.map(p=>'<h2>'+esc(p[0])+'</h2><div class="card">'+p[1].map(match).join('')+'</div>').join('')+'<div class="leg">* Punteggio dopo i calci di rigore.</div>';
}
function giornata(p){return '<h2>'+esc(p[0])+'</h2><div class="card">'+p[1].map(match).join('')+'</div>'}
function getTabs(){
  const t=[['Classifica','classifica',classifica]];
  PH.filter(p=>/^giornata/i.test(p[0])).forEach(p=>t.push([p[0],p[0].toLowerCase().replace(/\s+/g,'-'),()=>giornata(p)]));
  if(PH.some(p=>!/^giornata/i.test(p[0])))t.push(['Fase finale','fase-finale',finale]);
  return t}
const nav=document.getElementById('nav'),main=document.getElementById('main');
function show(){
  const t=getTabs(),h=location.hash.slice(1),i=Math.max(0,t.findIndex(x=>x[1]==h));
  nav.innerHTML='';
  t.forEach((x,k)=>{const b=document.createElement('button');b.textContent=x[0];b.className=k==i?'on':'';b.onclick=()=>{location.hash=x[1]};nav.appendChild(b)});
  main.innerHTML=t[i][2]();
}
addEventListener('hashchange',show);
async function init(){
  main.innerHTML='<p class="leg">Caricamento…</p>';
  try{
    if(SHEET_URL){const r=await fetch(SHEET_URL+(SHEET_URL.includes('?')?'&':'?')+'t='+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;setRows(parseCSV(await r.text()))}
    else setRows(FALLBACK);
  }catch(e){setRows(FALLBACK);main.innerHTML='<p class="leg">Impossibile leggere il foglio: mostro i dati salvati nella pagina.</p>'}
  show();
}
